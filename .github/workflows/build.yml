name: StoGram IPA

on:
  push:
    branches: [ master, main ]

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '1'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Restore Bazel disk cache
        uses: actions/cache@v4
        with:
          path: /Users/Shared/bazel-disk-cache
          key: stogram-bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'versions.json') }}
          restore-keys: |
            stogram-bazel-${{ runner.os }}-

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          BAZEL_CACHE_DIR="/Users/Shared/bazel-disk-cache"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT="$(($GITHUB_RUN_NUMBER+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          test -n "$STOGRAM_API_ID"
          test -n "$STOGRAM_API_HASH"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          CERTIFICATE_DATA="$(openssl pkcs12 -legacy -in build-system/fake-codesigning/certs/SelfSigned.p12 -clcerts -nokeys -passin pass: | openssl x509 -outform DER | base64)"
          test -n "$CERTIFICATE_DATA"
          export CERTIFICATE_DATA
          python3 - build-system/fake-codesigning/profiles/Telegram.mobileprovision <<'PY'
          import base64
          import plistlib
          import os
          import sys
          import uuid
          from datetime import datetime

          plist_path = "/tmp/stogram-profile.plist"

          profile = {
              "AppIDName": "StoGram",
              "ApplicationIdentifierPrefix": ["C67CF9S4VU"],
              "CreationDate": datetime.now(),
              "Platform": ["iPhoneOS"],
              "IsXcodeManaged": False,
              "Name": "StoGram Fake Development",
              "TeamIdentifier": ["C67CF9S4VU"],
              "TeamName": "StoGram",
              "TimeToLive": 26500,
              "UUID": str(uuid.uuid4()).upper(),
              "Version": 1,
              "DeveloperCertificates": [
                  base64.b64decode(os.environ["CERTIFICATE_DATA"])
              ],
              "ExpirationDate": datetime(2099, 1, 1),
              "Entitlements": {
                  "application-identifier": "C67CF9S4VU.ua.nbcreate.stogram",
                  "com.apple.security.application-groups": ["group.ua.nbcreate.stogram"],
                  "com.apple.developer.team-identifier": "C67CF9S4VU",
                  "com.apple.developer.carplay-messaging": True,
                  "get-task-allow": True,
                  "keychain-access-groups": ["C67CF9S4VU.*"],
                  "aps-environment": "development"
              }
          }
          with open(plist_path, "wb") as output:
              plistlib.dump(profile, output, fmt=plistlib.FMT_XML)
          PY
          SIGNING_IDENTITY="$(openssl pkcs12 -legacy -in build-system/fake-codesigning/certs/SelfSigned.p12 -clcerts -nokeys -passin pass: | openssl x509 -noout -subject -nameopt oneline,-esc_msb | sed -n 's/.*CN = \(.*\)$/\1/p')"
          test -n "$SIGNING_IDENTITY"
          security find-certificate -a -c "$SIGNING_IDENTITY" temp.keychain
          security cms -S -k temp.keychain -N "$SIGNING_IDENTITY" -i /tmp/stogram-profile.plist -o build-system/fake-codesigning/profiles/Telegram.mobileprovision

          python3 - "$GITHUB_WORKSPACE/build-system/stogram-configuration.template.json" "$SOURCE_DIR/build-system/stogram-configuration.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              configuration = json.load(source)
          configuration["api_id"] = os.environ["STOGRAM_API_ID"]
          configuration["api_hash"] = os.environ["STOGRAM_API_HASH"]
          with open(sys.argv[2], "w", encoding="utf-8") as destination:
              json.dump(configuration, destination, indent=2)
          PY

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_CACHE_DIR" \
            build \
            --configurationPath="build-system/stogram-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --disableExtensions \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          IPA_PATH="bazel-bin/Telegram/Swiftgram.ipa"
          test -f "$IPA_PATH"
          cp "$IPA_PATH" "$OUTPUT_PATH/StoGram.ipa"

          # collect dsym
          mkdir -p build/DSYMs
          DSYM_PATH="bazel-bin/Telegram/Swiftgram.app.dSYM"
          test -d "$DSYM_PATH"
          cp -R "$DSYM_PATH" build/DSYMs/
          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null

        env:
          STOGRAM_API_ID: ${{ secrets.STOGRAM_API_ID }}
          STOGRAM_API_HASH: ${{ secrets.STOGRAM_API_HASH }}

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          release_name: StoGram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            An unsigned StoGram build for iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          draft: false
          prerelease: false

      - name: Upload Release IPA
        id: upload-release-ipa 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /Users/Shared/telegram-ios/build/artifacts/StoGram.ipa
          asset_name: StoGram.ipa
          asset_content_type: application/zip

      - name: Upload Release DSYM
        id: upload-release-dsym 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          asset_name: Telegram.DSYMs.zip
          asset_content_type: application/zip
